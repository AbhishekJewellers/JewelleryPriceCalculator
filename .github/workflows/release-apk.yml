name: Release APK

# Build a distributable APK whenever a version tag is pushed.
# The APK is uploaded as a workflow artifact named:
#   JewelleryPriceCalculator_<tag>.apk
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle 9.4.1 (matching gradle-wrapper.properties) and enables
      # build caching. The wrapper JAR is intentionally git-ignored, so we use
      # this Gradle to regenerate it before building.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.4.1

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Rename the generated APK to <app-name>_<tag_version>.apk.
      - name: Stage renamed APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/JewelleryPriceCalculator_${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JewelleryPriceCalculator_${{ github.ref_name }}
          path: artifacts/JewelleryPriceCalculator_${{ github.ref_name }}.apk
          if-no-files-found: error
