name: Release APK

# Build a distributable APK whenever a version tag is pushed, or on demand
# from the Actions tab ("Run workflow"). The APK is uploaded as a workflow
# artifact named:
#   JewelleryPriceCalculator_<version>.apk
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the APK filename (e.g. v9.0). Defaults to the branch/tag it runs on.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle 9.4.1 (matching gradle-wrapper.properties) and enables
      # build caching. The wrapper JAR is intentionally git-ignored, so we use
      # this Gradle to regenerate it before building.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.4.1

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Resolve the label used in the APK filename: the manual "version" input
      # when provided (workflow_dispatch), otherwise the pushed tag / ref name.
      - name: Resolve version label
        id: label
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          NAME="${INPUT_VERSION}"
          if [ -z "$NAME" ]; then
            NAME="${GITHUB_REF_NAME}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # Rename the generated APK to <app-name>_<version>.apk.
      - name: Stage renamed APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/JewelleryPriceCalculator_${{ steps.label.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JewelleryPriceCalculator_${{ steps.label.outputs.name }}
          path: artifacts/JewelleryPriceCalculator_${{ steps.label.outputs.name }}.apk
          if-no-files-found: error
